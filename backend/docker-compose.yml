
services:
  db:
    image: postgres:17
    container_name: mccl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcclnonwovenindustries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mccl123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcclnonwovenindustries"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mccl-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mcclnonwovenindustries
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mccl123
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
